{% extends "base.html" %}

{% block title %}{{ t.register }} | SwachhMitra{% endblock %}

{% block content %}

<div class="row justify-content-center">

<div class="col-md-6 col-lg-5">

    <div class="card shadow-sm">

        <div class="card-body p-4">

            <h2 class="h4 mb-3 text-success">
                {{ t.user_registration }}
            </h2>


            <form method="post">


                <div class="mb-3">

                    <label for="full_name" class="form-label">
                        {{ t.full_name }}
                    </label>

                    <input
                        type="text"
                        class="form-control"
                        id="full_name"
                        name="full_name"
                        required
                    >

                </div>


                <div class="mb-3">

                    <label for="email" class="form-label">
                        {{ t.email }}
                    </label>

                    <input
                        type="email"
                        class="form-control"
                        id="email"
                        name="email"
                        required
                    >

                </div>


                <div class="mb-3">

                    <label for="password" class="form-label">
                        {{ t.password }}
                    </label>

                    <input
                        type="password"
                        class="form-control"
                        id="password"
                        name="password"
                        minlength="6"
                        required
                    >

                </div>


                <div class="mb-3">

                    <label for="confirm_password" class="form-label">
                        {{ t.confirm_password }}
                    </label>

                    <input
                        type="password"
                        class="form-control"
                        id="confirm_password"
                        name="confirm_password"
                        minlength="6"
                        required
                    >

                </div>


                <button
                    type="submit"
                    class="btn btn-success w-100"
                >
                    {{ t.register }}
                </button>

            </form>


            <p class="mt-3 mb-0">

                {{ t.already_account }}

                <a href="{{ url_for('login') }}">
                    {{ t.log_in }}
                </a>

            </p>

        </div>

    </div>

</div>

</div>

{% endblock %}
