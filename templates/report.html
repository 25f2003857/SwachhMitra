{% extends "base.html" %}

{% block title %}{{ t.report_garbage }} | SwachhMitra{% endblock %}

{% block content %}

<div class="row justify-content-center">

<div class="col-md-9 col-lg-7">

    <div class="card shadow-sm">

        <div class="card-body p-4">

            <h2 class="text-success mb-2">
                {{ t.report_garbage }}
            </h2>

            <p class="text-muted mb-4">
                {{ t.report_garbage_help }}
            </p>


            <form method="post" enctype="multipart/form-data">


                <!-- WASTE TYPE -->

                <div class="mb-3">

                    <label for="waste_type" class="form-label">
                        {{ t.waste_type }}
                    </label>

                    <select
                        class="form-select"
                        id="waste_type"
                        name="waste_type"
                    >

                        <option value="">
                            {{ t.select_waste_type }}
                        </option>

                        <option value="Dry Waste">
                            {{ t.dry_waste }}
                        </option>

                        <option value="Wet Waste">
                            {{ t.wet_waste }}
                        </option>

                        <option value="Plastic Waste">
                            {{ t.plastic_waste }}
                        </option>

                        <option value="E-Waste">
                            {{ t.e_waste }}
                        </option>

                        <option value="Construction Waste">
                            {{ t.construction }}
                        </option>

                        <option value="Medical Waste">
                            {{ t.medical }}
                        </option>

                        <option value="Mixed Waste">
                            {{ t.mixed_waste }}
                        </option>

                        <option value="Other">
                            {{ t.other }}
                        </option>

                    </select>

                </div>


                <!-- IMAGE -->

                <div class="mb-3">

                    <label for="image" class="form-label">
                        {{ t.garbage_image }}
                    </label>

                    <div class="form-text mb-2">
                        {{ t.ai_detection_note }}
                    </div>

                    <input
                        type="file"
                        class="form-control"
                        id="image"
                        name="image"
                        accept=".jpg,.jpeg,.png,.webp"
                    >

                    <div class="form-text">
                        {{ t.upload_clear_photo }}
                        {{ t.maximum_size }}
                    </div>

                </div>


                <!-- DESCRIPTION -->

                <div class="mb-3">

                    <label for="description" class="form-label">
                        {{ t.description }}
                    </label>

                    <textarea
                        class="form-control"
                        id="description"
                        name="description"
                        rows="4"
                        placeholder="{{ t.description_placeholder }}"
                    ></textarea>

                </div>


                <!-- ADDRESS -->

                <div class="mb-3">

                    <label for="address" class="form-label">
                        {{ t.location_locality }}
                    </label>

                    <input
                        type="text"
                        class="form-control"
                        id="address"
                        name="address"
                        placeholder="{{ t.location_example }}"
                    >

                </div>


                <!-- COORDINATES -->

                <div class="row">

                    <div class="col-md-6 mb-3">

                        <label for="latitude" class="form-label">
                            {{ t.latitude }}
                        </label>

                        <input
                            type="text"
                            class="form-control"
                            id="latitude"
                            name="latitude"
                            placeholder="{{ t.optional }}"
                        >

                    </div>


                    <div class="col-md-6 mb-3">

                        <label for="longitude" class="form-label">
                            {{ t.longitude }}
                        </label>

                        <input
                            type="text"
                            class="form-control"
                            id="longitude"
                            name="longitude"
                            placeholder="{{ t.optional }}"
                        >

                    </div>

                </div>


                <!-- ANONYMOUS -->

                <div class="form-check mb-4">

                    <input
                        class="form-check-input"
                        type="checkbox"
                        id="anonymous"
                        name="anonymous"
                    >

                    <label
                        class="form-check-label"
                        for="anonymous"
                    >
                        {{ t.anonymous_report }}
                    </label>

                </div>


                <!-- SUBMIT -->

                <button
                    type="submit"
                    class="btn btn-success w-100"
                >
                    {{ t.submit_garbage_report }}
                </button>

            </form>


            <!-- BACK -->

            <div class="mt-3 text-center">

                <a
                    href="{{ url_for('user_dashboard') }}"
                    class="text-success"
                >
                    {{ t.back_to_dashboard }}
                </a>

            </div>

        </div>

    </div>

</div>

</div>

{% endblock %}
