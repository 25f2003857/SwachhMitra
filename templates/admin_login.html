{% extends "base.html" %}

{% block title %}{{ t.admin_login }} | SwachhMitra{% endblock %}

{% block content %}

<div class="row justify-content-center">


<div class="col-md-6 col-lg-5">

    <div class="card shadow-sm">

        <div class="card-body p-4">

            <h2 class="h4 mb-3 text-success">
                {{ t.admin_login }}
            </h2>

            <p class="text-muted small">
                {{ t.default_admin_account }}
            </p>


            <form method="post">

                <div class="mb-3">

                    <label for="email" class="form-label">
                        {{ t.admin_email }}
                    </label>

                    <input
                        type="email"
                        class="form-control"
                        id="email"
                        name="email"
                        value="admin@swachhmitra.com"
                        required
                    >

                </div>


                <div class="mb-3">

                    <label for="password" class="form-label">
                        {{ t.password }}
                    </label>

                    <input
                        type="password"
                        class="form-control"
                        id="password"
                        name="password"
                        required
                    >

                </div>


                <button
                    type="submit"
                    class="btn btn-success w-100"
                >
                    {{ t.admin_login }}
                </button>

            </form>

        </div>

    </div>

</div>

</div>

{% endblock %}
