{% extends "base.html" %}

{% block title %}{{ t.my_profile }} | SwachhMitra{% endblock %}

{% block content %}

<div class="row justify-content-center">

<div class="col-md-8 col-lg-6">

    <div class="card shadow-sm">

        <div class="card-body p-4">

            <h2 class="text-success mb-4">
                {{ t.my_profile }}
            </h2>

            <form method="post">


                <div class="mb-3">

                    <label for="full_name" class="form-label">
                        {{ t.full_name }}
                    </label>

                    <input
                        type="text"
                        class="form-control"
                        id="full_name"
                        name="full_name"
                        value="{{ user['full_name'] }}"
                        required
                    >

                </div>


                <div class="mb-3">

                    <label for="email" class="form-label">
                        {{ t.email }}
                    </label>

                    <input
                        type="email"
                        class="form-control"
                        id="email"
                        value="{{ user['email'] }}"
                        disabled
                    >

                    <div class="form-text">
                        {{ t.email_cannot_change }}
                    </div>

                </div>


                <div class="mb-3">

                    <label for="phone" class="form-label">
                        {{ t.phone_number }}
                    </label>

                    <input
                        type="tel"
                        class="form-control"
                        id="phone"
                        name="phone"
                        value="{{ user['phone'] or '' }}"
                        placeholder="{{ t.enter_phone }}"
                    >

                </div>


                <div class="mb-3">

                    <label for="address" class="form-label">
                        {{ t.address_locality }}
                    </label>

                    <textarea
                        class="form-control"
                        id="address"
                        name="address"
                        rows="3"
                        placeholder="{{ t.enter_address }}"
                    >{{ user['address'] or '' }}</textarea>

                </div>


                <button
                    type="submit"
                    class="btn btn-success w-100"
                >
                    {{ t.save_profile }}
                </button>

            </form>


            <div class="mt-3 text-center">

                <a
                    href="{{ url_for('user_dashboard') }}"
                    class="text-success"
                >
                    {{ t.back_to_dashboard }}
                </a>

            </div>

        </div>

    </div>

</div>

</div>

{% endblock %}
