{% extends "base.html" %}

{% block title %}{{ t.user_login }} | SwachhMitra{% endblock %}

{% block content %}

<div class="row justify-content-center">

<div class="col-md-6 col-lg-5">

    <div class="card shadow-sm">

        <div class="card-body p-4">

            <h2 class="h4 mb-3 text-success">
                {{ t.user_login }}
            </h2>

            <form method="post">

                <div class="mb-3">

                    <label for="email" class="form-label">
                        {{ t.email }}
                    </label>

                    <input
                        type="email"
                        class="form-control"
                        id="email"
                        name="email"
                        required
                    >

                </div>


                <div class="mb-3">

                    <label for="password" class="form-label">
                        {{ t.password }}
                    </label>

                    <input
                        type="password"
                        class="form-control"
                        id="password"
                        name="password"
                        required
                    >

                </div>


                <button
                    type="submit"
                    class="btn btn-success w-100"
                >
                    {{ t.login }}
                </button>

            </form>


            <p class="mt-3 mb-0">

                {{ t.new_user }}

                <a href="{{ url_for('register') }}">
                    {{ t.register_here }}
                </a>

            </p>

        </div>

    </div>

</div>

</div>

{% endblock %}
